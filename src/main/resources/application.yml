spring:
  application:
    name: babplanner-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # schema는 Flyway migration만으로 관리한다. create/update를 쓰지 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

bapplanner:
  auth:
    # 실제 키는 환경 변수로만 주입한다. 기본값을 두지 않아 미설정 시 기동에 실패한다.
    signing-key: ${JWT_SIGNING_KEY:}
    issuer: babplanner
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    verification-code-ttl: 3m
    verification-resend-cooldown: 60s
    verification-token-ttl: 10m

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
