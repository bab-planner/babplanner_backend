spring:
  application:
    name: babplanner-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # schema는 Flyway migration만으로 관리한다. create/update를 쓰지 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      # 잔반 사진 한 장을 받는 용도다. 더 큰 업로드는 받지 않는다.
      max-file-size: 10MB
      max-request-size: 12MB

bapplanner:
  # 로컬 E2E용 사용자 fixture. 기본은 꺼져 있고 값도 없다.
  # 켜려면 local/dev 프로필에서 값을 전부 환경 변수로 주입해야 한다.
  dev-user:
    enabled: ${DEV_USER_ENABLED:false}
    phone: ${DEV_USER_PHONE:}
    password: ${DEV_USER_PASSWORD:}
    student-id: ${DEV_USER_STUDENT_ID:}
    name: ${DEV_USER_NAME:}
  # 로컬 E2E용 설문 fixture. 기본은 꺼져 있다.
  dev-survey:
    enabled: ${DEV_SURVEY_ENABLED:false}
  # SMS 구현을 명시적으로 고른다. 기본값을 두지 않아 운영에서 NoOp가
  # 조용히 선택되는 일이 없다. 로컬/개발은 프로필 설정에서 noop을 켠다.
  sms:
    mode: ${SMS_MODE:}
  # 잔반 이미지 저장소와 분석기 구현을 명시적으로 고른다. 기본값을 두지 않아
  # 운영에서 로컬 디스크 저장소나 가짜 분석기가 조용히 선택되는 일이 없다.
  waste:
    storage-mode: ${WASTE_STORAGE_MODE:}
    local-root: ${WASTE_LOCAL_ROOT:}
    analyzer-mode: ${WASTE_ANALYZER_MODE:}
    max-image-bytes: 10485760
  auth:
    # 실제 키는 환경 변수로만 주입한다. 기본값을 두지 않아 미설정 시 기동에 실패한다.
    signing-key: ${JWT_SIGNING_KEY:}
    # JWT 서명 키와 다른 값이어야 한다. 미설정이면 기동에 실패한다.
    phone-verification-hmac-key: ${PHONE_VERIFICATION_HMAC_KEY:}
    issuer: babplanner
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    verification-code-ttl: 3m
    verification-resend-cooldown: 60s
    verification-token-ttl: 10m

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
