spring:
  datasource:
    url: jdbc:h2:mem:babplanner;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

bapplanner:
  # 테스트는 UTC로 고정한다. 시간대 경계 자체를 확인하는 테스트는 자기
  # 시간대를 명시해서 쓴다.
  business-zone-id: UTC
  sms:
    mode: noop
  waste:
    storage-mode: local
    # 테스트 전용 임시 디렉터리. 실제 서비스 경로가 아니다.
    local-root: ${java.io.tmpdir}/babplanner-test-waste-images
    analyzer-mode: fake
    # 분석을 호출 스레드에서 끝낸다. 결과를 기다리는 sleep이 필요 없다.
    async-enabled: false
  auth:
    # 테스트 전용 가짜 키. 실제 서비스 키가 아니다.
    signing-key: test-only-signing-key-not-a-real-secret-0123456789
    # 서명 키와 다른 테스트 전용 가짜 키.
    phone-verification-hmac-key: test-only-phone-hmac-key-not-a-real-secret-98765
    issuer: babplanner
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    verification-code-ttl: 3m
    verification-resend-cooldown: 60s
    verification-token-ttl: 10m
